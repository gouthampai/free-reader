[package]
name = "free-reader"
version = "0.1.0"
description = "A polished, cross-platform ereader"
authors = ["Goutham Pai"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "free_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.11.0"
thiserror = "=2.0.21"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
walkdir = "=2.5.0"
percent-encoding = "=2.3.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
